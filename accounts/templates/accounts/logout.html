{% extends 'accounts/base.html' %}

{% block title %}Logged Out - AskPaddie{% endblock %}

{% block content %}
<div class="bg-gray-50 py-16">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="bg-primary px-6 py-4">
                <h3 class="text-xl font-medium text-white">Logged Out</h3>
            </div>
            
            <div class="px-8 py-10 text-center">
                <div class="flex justify-center mb-6">
                    <div class="bg-green-100 p-3 rounded-full">
                        <svg class="h-12 w-12 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </div>
                
                <h2 class="text-2xl font-bold text-gray-800 mb-4">You've been logged out</h2>
                <p class="text-gray-600 mb-8">
                    Thank you for using AskPaddie. Your safety is our priority.
                </p>
                
                <a href="{% url 'login' %}" class="inline-block bg-secondary hover:bg-secondary-dark text-dark font-bold py-3 px-8 rounded-md focus:outline-none transition duration-150 ease-in-out">
                    Log In Again
                </a>
                
                <p class="mt-8 text-sm text-gray-500">
                    Not ready to leave? <a href="/" class="text-primary hover:underline font-medium">Return to home page</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
