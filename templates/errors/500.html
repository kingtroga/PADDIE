{% extends "accounts/base.html" %}

{% block title %}500 - Server Error | AskPaddie{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center px-4 py-12">
    <div class="text-center max-w-lg">
        <h1 class="text-6xl font-bold text-dark mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Server Error</h2>
        <p class="text-gray-600 mb-8">We're experiencing some technical difficulties. Our team has been notified and is working to fix the issue. Please try again later.</p>
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="/" class="bg-primary text-white font-medium px-6 py-3 rounded-full hover:bg-primary-dark transition shadow-md">
                Return to Home
            </a>
            <button onclick="window.location.reload()" class="bg-dark text-white font-medium px-6 py-3 rounded-full hover:opacity-90 transition shadow-md">
                Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
