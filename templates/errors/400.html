{% extends "accounts/base.html" %}

{% block title %}400 - Bad Request | AskPaddie{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center px-4 py-12">
    <div class="text-center max-w-lg">
        <h1 class="text-6xl font-bold text-dark mb-4">400</h1>
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Bad Request</h2>
        <p class="text-gray-600 mb-8">The request could not be processed due to malformed syntax or invalid parameters. Please try again with different values.</p>
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="/" class="bg-primary text-white font-medium px-6 py-3 rounded-full hover:bg-primary-dark transition shadow-md">
                Return to Home
            </a>
            <button onclick="window.history.back()" class="bg-dark text-white font-medium px-6 py-3 rounded-full hover:opacity-90 transition shadow-md">
                Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
